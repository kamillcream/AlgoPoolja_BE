spring:
  application:
    name: algorithm-blank-quiz
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.7

app:
  auth:
    jwt-secret: ${JWT_SECRET:}
  dashboard:
    default-timezone: Asia/Seoul

server:
  error:
    include-message: always
