spring:
  application:
    name: algorithm-blank-quiz
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.7

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:algopoolja}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver


server:
  error:
    include-message: always
