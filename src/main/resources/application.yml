spring:
  application:
    name: algorithm-blank-quiz
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.7
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-not-configured}
            scope: openid,profile,email

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  auth:
    jwt-secret: ${JWT_SECRET:}
  dashboard:
    default-timezone: Asia/Seoul

server:
  error:
    include-message: always
