spring:
  application:
    name: algorithm-blank-quiz
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.7
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-not-configured}
            scope: openid,profile,email
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/algopoolja}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  datasource:
    url: jdbc:postgresql:///${DB_NAME}?cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlRefreshStrategy=lazy
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

    jpa:
      hibernate:
        ddl-auto: update
      properties:
        hibernate:
          format_sql: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  auth:
    jwt-secret: ${JWT_SECRET:}
  dashboard:
    default-timezone: Asia/Seoul

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:none}
        secure: ${SESSION_COOKIE_SECURE:true}
  error:
    include-message: always
